<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Harmonia Pianos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <div class="checkout-cabecalho">
            <p class="checkout-etapa">CHECKOUT</p>
            <h1>Finalizar compra</h1>
            <p>Confira os itens do seu pedido antes de continuar.</p>
        </div>

        <section class="resumo-pedido">
            <h2>Resumo do pedido</h2>

            <div id="checkout-itens"></div>

            <div class="checkout-total-area">
                <span>Total</span>
                <p id="checkout-total">R$ 0,00</p>
            </div>

            <div class="checkout-acoes">
                <a href="produto.html" class="btn-voltar-carrinho">
                    Voltar aos produtos
                </a>

                <button type="button" id="btn-continuar-pagamento">
                    Continuar para pagamento
                </button>
            </div>
        </section>

        <section class="dados-comprador">

            <h2>Dados do comprador</h2>
            <p>Preencha seus dados para continuar com a compra.</p>

            <form id="form-comprador">

                <div class="campo-formulario">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="campo-formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo-formulario">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo-formulario">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="campo-formulario">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, número e complemento" required>
                </div>

            </form>

        </section>

        </div>

    </main>

    <script src="checkout.js"></script>
</body>

</html>
